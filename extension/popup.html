<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Chatbot Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <div class="popup-brand">
        <div class="popup-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="white" />
            <path d="M2 17L12 22L22 17" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6" />
            <path d="M2 12L12 17L22 12" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8" />
          </svg>
        </div>
        <div>
          <div class="popup-title">YT Chatbot</div>
          <div class="popup-version">v1.0.0</div>
        </div>
      </div>
    </div>

    <!-- Connection Status -->
    <div class="status-section">
      <div class="status-label">Backend Status</div>
      <div id="status-indicator" class="status-indicator disconnected">
        <div class="status-dot"></div>
        <span id="status-text">Checking...</span>
      </div>
    </div>

    <!-- Backend URL -->
    <div class="setting-group">
      <label for="backend-url" class="setting-label">Backend URL</label>
      <div class="input-row">
        <input
          type="text"
          id="backend-url"
          placeholder="http://localhost:8000"
          spellcheck="false"
        />
        <button id="save-btn" class="save-btn">Save</button>
      </div>
    </div>

    <!-- Test Connection -->
    <button id="test-btn" class="test-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M22 12H18L15 21L9 3L6 12H2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Test Connection
    </button>

    <!-- Footer -->
    <div class="popup-footer">
      <span>Powered by Groq + LangChain</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
